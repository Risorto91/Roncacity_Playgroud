<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ronca City Playground 2026 — Dashboard TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0d; --bg-card:#17151d; --gold:#e3b23c; --gold-dim:#a9812b;
    --purple:#4a2384; --white:#f6f3ec; --muted:#9d97a3; --line:#2c2a35;
    --green:#4caf50; --red:#ff5c5c; --qual:#5fd38d;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ width:100%; height:100%; overflow:hidden; }
  body{
    background: var(--bg);
    display:flex; align-items:center; justify-content:center;
  }
  #tvRoot{
    width:1920px; height:1080px; flex-shrink:0;
    transform-origin: center center;
    background:
      radial-gradient(ellipse 1400px 800px at 10% -10%, rgba(74,35,132,0.35), transparent 60%),
      radial-gradient(ellipse 1000px 600px at 100% 0%, rgba(227,178,60,0.10), transparent 55%),
      var(--bg);
    color:var(--white); font-family:'Inter',sans-serif;
    display:flex; flex-direction:column; height:1080px; overflow:hidden;
  }
  .display{ font-family:'Anton',sans-serif; text-transform:uppercase; letter-spacing:0.02em; }
  .tv-header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 20px 48px;
    border-bottom:1px solid var(--line);
    background: rgba(10,10,13,0.6);
  }
  .tv-header .brand{ display:flex; align-items:center; gap:14px; }
  .tv-header .brand img{ height:48px; }
  .tv-header .brand-text .l1{ font-family:'Anton',sans-serif; font-size:26px; letter-spacing:0.02em; }
  .tv-header .brand-text .l2{ font-size:12px; color:var(--gold); letter-spacing:0.18em; }
  .tv-header .right{ display:flex; align-items:center; gap:18px; }
  .tv-header .day-badge{
    font-family:'Anton',sans-serif; font-size:16px; color:var(--gold);
    border:1px solid var(--gold-dim); border-radius:20px; padding:5px 14px;
    background: rgba(227,178,60,0.08);
  }
  .tv-header .mode-badge{
    font-family:'Anton',sans-serif; font-size:14px; color:#c9a8ff;
    border:1px solid var(--purple); border-radius:20px; padding:5px 14px;
    background: rgba(74,35,132,0.25); display:none;
  }
  .tv-header .mode-badge.active{ display:inline-block; }
  .tv-header .clock{ font-family:'Anton',sans-serif; font-size:28px; color:var(--white); min-width:2.2em; text-align:right; }
  .tv-header .status{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); }
  .tv-header .status .dot{ width:8px; height:8px; border-radius:50%; background:var(--green); }
  .tv-header .status.err .dot{ background:var(--red); }
  .tv-stage{ flex:1; overflow:hidden; position:relative; }
  .panel{
    position:absolute; inset: 32px 48px;
    opacity:0; transition: opacity .5s ease;
    display:flex; flex-direction:column; min-height:0;
  }
  .panel.active{ opacity:1; }
  .panel-title{ display:flex; align-items:baseline; gap:16px; margin-bottom: 20px; }
  .panel-title .cat{
    font-family:'Anton',sans-serif; font-size:14px; letter-spacing:0.14em;
    padding: 5px 14px; border-radius:16px; border:1px solid var(--gold-dim); color:var(--gold);
    background: rgba(227,178,60,0.08); white-space:nowrap;
  }
  .panel-title h1{ font-family:'Anton',sans-serif; font-size:42px; }
  .panel-title .sub{ font-size:15px; color:var(--muted); margin-left:auto; }
  .match-grid{ flex:1; display:grid; grid-template-columns: 1fr 1fr; gap: 16px; align-content:start; overflow-y:auto; overflow-x:hidden; min-height:0; }
  .match-grid::-webkit-scrollbar{ width:5px; }
  .match-grid::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
  .match-card{
    background: var(--bg-card); border:1px solid var(--line); border-radius:8px;
    padding: 18px 24px;
    display:flex; align-items:center; justify-content:space-between; gap:14px;
  }
  .match-card.done{ border-color: rgba(227,178,60,0.35); }
  .match-teams{ display:flex; flex-direction:column; gap:6px; min-width:0; }
  .match-teams .mt-line{ font-size:20px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .match-teams .mt-line .vs{ color:var(--muted); font-weight:400; margin:0 6px; font-size:0.8em; }
  .match-teams .mt-line .team.winner{
    color:var(--gold); background: rgba(227,178,60,0.16);
    padding: 1px 7px; border-radius:4px;
  }
  .match-teams .mt-meta{ font-size:12px; color:var(--muted); }
  .match-score{ font-family:'Anton',sans-serif; font-size:30px; color:var(--gold); flex-shrink:0; text-align:right; min-width: 2.4em; }
  .match-score.time{ color:var(--white); font-size:22px; }
  .empty-msg{ flex:1; display:flex; align-items:center; justify-content:center; font-family:'Anton',sans-serif; font-size:30px; color:var(--muted); text-align:center; }
  .class-wrap{ flex:1; display:flex; flex-direction:column; overflow:hidden; min-height:0; }
  .class-block{ background: var(--bg-card); border:1px solid var(--line); border-radius:8px; overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column; flex:1; min-height:0; }
  .class-block::-webkit-scrollbar{ width:5px; }
  .class-block::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
  .class-block table{ width:100%; border-collapse:collapse; table-layout:fixed; }
  .class-block th{
    text-align:left; padding: 14px 22px;
    font-size:14px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em;
    border-bottom:1px solid var(--line);
  }
  .class-block td{ padding: 16px 22px; font-size:22px; border-bottom:1px solid var(--line); }
  .class-block td.num{ text-align:center; color:var(--muted); }
  .class-block tr:last-child td{ border-bottom:none; }
  .class-block td.squadra{ font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .class-block tr.qualified,
  .class-block tr.qualified-lakers{ background: rgba(227,178,60,0.14); box-shadow: inset 3px 0 0 var(--purple); }
  .class-block tr.qualified td.num.pos,
  .class-block tr.qualified-lakers td.num.pos{ color:var(--gold); font-weight:800; }
  .class-block.compact th{ padding: 9px 16px; font-size:12px; }
  .class-block.compact td{ padding: 9px 16px; font-size:17px; }
  .class-legend{ margin-top: 12px; font-size:13px; color:var(--muted); display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .class-legend .sw{ width:12px; height:12px; border-radius:3px; background: rgba(227,178,60,0.35); border:1px solid var(--gold); box-shadow: inset 2px 0 0 var(--purple); }
  .tv-nav{
    display:flex; align-items:center; gap: 12px;
    padding: 14px 30px;
    border-top:1px solid var(--line); background: rgba(10,10,13,0.75);
    overflow-x:auto; -webkit-overflow-scrolling:touch;
  }
  .tv-nav::-webkit-scrollbar{ height:4px; }
  .tv-nav::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
  .nav-btn-play{
    flex-shrink:0; width:40px; height:40px; border-radius:50%;
    background: var(--bg-card); border:1px solid var(--gold-dim); color:var(--gold);
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px;
  }
  .nav-sep{ flex-shrink:0; width:1px; height:20px; background:var(--line); margin:0 4px; }
  .nav-group-label{ flex-shrink:0; font-family:'Anton',sans-serif; font-size:11px; color:var(--muted); letter-spacing:0.08em; margin-right:2px; }
  .nav-pill{
    flex-shrink:0; font-size:13px; padding: 9px 16px;
    border-radius:16px; border:1px solid var(--line); background:var(--bg-card); color:var(--muted); cursor:pointer;
    white-space:nowrap;
  }
  .nav-pill.active{ border-color:var(--gold-dim); color:var(--gold); background: rgba(227,178,60,0.1); }
  .nav-pill.empty{ opacity:0.4; }
  .sponsor-marquee{
    overflow:hidden; white-space:nowrap;
    border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    background: rgba(20,19,25,0.55);
    padding: 12px 0;
  }
  .sponsor-track{
    display:inline-flex; align-items:center; gap: 36px;
    animation: sponsorScroll 110s linear infinite;
  }
  .sponsor-marquee:hover .sponsor-track{ animation-play-state: paused; }
  .sponsor-item{
    flex-shrink:0; height: 52px; padding: 6px 20px;
    background:#f4f2ec; border-radius:6px; display:flex; align-items:center; justify-content:center;
  }
  .sponsor-item.noplate{ background:transparent; border:1px solid var(--line); }
  .sponsor-item img{ max-height:100%; max-width: 140px; object-fit:contain; }
  .sponsor-item .txt{ color:var(--muted); font-size:12px; padding:0 6px; }
  @keyframes sponsorScroll{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
  .agenda-scroll{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap: 18px; }
  .agenda-scroll::-webkit-scrollbar{ width:5px; }
  .agenda-scroll::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
  .agenda-fase{
    font-family:'Anton',sans-serif; color:var(--gold); font-size:18px;
    padding-left:10px; border-left:3px solid var(--gold-dim); margin-bottom:6px;
  }
  .match-grid.compact{ margin-bottom:2px; }
  .class-grid-3{ flex:1; display:grid; grid-template-columns: repeat(3, 1fr); gap: 18px; overflow:hidden; }
  .class-grid-3 .class-block .cb-head{
    padding: 12px 16px; background: rgba(227,178,60,0.08);
    border-bottom:1px solid var(--line); font-family:'Anton',sans-serif; font-size:16px; color:var(--gold);
  }
  .class-grid-3 .class-block td, .class-grid-3 .class-block th{ padding: 9px 14px; font-size:15px; }
  .court-grid{ flex:1; display:grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); gap: 22px; min-height:0; }
  .court-card{
    background: var(--bg-card); border:1px solid var(--line); border-radius:12px;
    padding: 28px; display:flex; flex-direction:column; justify-content:center; gap: 10px;
    min-width:0; min-height:0;
  }
  .court-head{ font-family:'Anton',sans-serif; font-size:19px; color:var(--gold); letter-spacing:0.04em; }
  .court-status{ font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em; }
  .court-teams{ font-family:'Anton',sans-serif; font-size:34px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .court-teams .vs{ color:var(--muted); font-family:'Inter',sans-serif; font-weight:400; margin:0 8px; font-size:0.6em; }
  .court-meta{ font-size:14px; color:var(--muted); }
  .court-time{ font-family:'Anton',sans-serif; font-size:36px; color:var(--gold); }
  .loading-screen{
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; background:var(--bg); z-index:100;
  }
  .loading-screen h2{ font-family:'Anton',sans-serif; font-size:36px; color:var(--gold); text-align:center; padding:0 20px;}
  .loading-screen p{ color:var(--muted); font-size:14px; text-align:center; padding: 0 30px; max-width:640px; }
  .view-toggle-btn{
    display:none;
    font-family:'Anton',sans-serif; font-size:13px; color:var(--white);
    border:1px solid var(--gold-dim); border-radius:20px; padding:6px 14px;
    background: rgba(227,178,60,0.12); cursor:pointer; white-space:nowrap;
  }
  .view-toggle-btn:hover{ background: rgba(227,178,60,0.22); }
  .stack-wrap{ flex:1; display:flex; flex-direction:column; gap:18px; overflow-y:auto; min-height:0; }
  .stack-wrap::-webkit-scrollbar{ width:5px; }
  .stack-wrap::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
  .class-block.stacked{ flex:none; min-height:auto; overflow-y:visible; }
  .bracket-scroll{ flex:1; overflow:auto; display:flex; }
  .bracket-scroll::-webkit-scrollbar{ height:6px; width:6px; }
  .bracket-scroll::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
  .bracket{ display:flex; align-items:stretch; min-height:100%; padding-bottom:10px; }
  .bracket-round{ display:flex; flex-direction:column; padding:0 34px; min-width:260px; flex-shrink:0; }
  .bracket-round-title{
    font-family:'Anton',sans-serif; font-size:15px; letter-spacing:0.1em; color:var(--gold);
    text-transform:uppercase; text-align:center; margin-bottom:18px;
  }
  .bracket-round-matches{ flex:1; display:flex; flex-direction:column; justify-content:space-around; }
  .bracket-match{
    background: var(--bg-card); border:1px solid var(--line); border-radius:8px;
    padding: 12px 18px; margin: 12px 0; position:relative;
  }
  .bracket-match::after{
    content:''; position:absolute; top:50%; right:-34px; width:34px; height:2px;
    background: var(--gold-dim); opacity:0.55;
  }
  .bracket-round:last-child .bracket-match::after{ display:none; }
  .bracket-team{ display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:18px; font-weight:700; padding:4px 0; }
  .bracket-team span:first-child{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bracket-team .pts{ font-family:'Anton',sans-serif; color:var(--muted); font-size:17px; flex-shrink:0; }
  .bracket-team.winner{ color:var(--gold); }
  .bracket-team.winner .pts{ color:var(--gold); }
  .bracket-vs-sep{ height:1px; background:var(--line); margin:4px 0; }
  .bracket-match-meta{ font-size:11px; color:var(--muted); margin-top:6px; text-align:center; }
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <h2>RONCA CITY PLAYGROUND — DASHBOARD TV</h2>
  <p id="loadingMsg">Connessione ai dati del torneo…</p>
</div>

<div id="tvRoot">

  function getCurrentDayKey(){
    const params = new URLSearchParams(location.search);
    if (params.get('day') && DAY_LABELS[params.get('day')]) return params.get('day');
    const iso = new Date().toISOString().slice(0,10);
    return DATE_TO_DAY[iso] || 'lunedi';
  }

  // ---- Finestra oraria Under: giovedì/venerdì 17:00→19:45 ----
  function timeStrToMinutes(t){
    const [h, m] = t.split(':').map(Number);
    return h * 60 + m;
  }
  function isUnderWindow(dayKey){
    if (!UNDER_DAYS.includes(dayKey)) return false;
    const params = new URLSearchParams(location.search);
    if (params.get('under') === '1') return true;
    if (params.get('under') === '0') return false;
    const now = new Date();
    const mins = now.getHours() * 60 + now.getMinutes();
    return mins >= timeStrToMinutes(UNDER_WINDOW.start) && mins <= timeStrToMinutes(UNDER_WINDOW.end);
  }

  function isOnlyUnderMode(){
    const params = new URLSearchParams(location.search);
    return params.get('under') === '1' || params.get('onlyUnder') === '1';
  }

  // ---- Modalità di visualizzazione: 'under' (solo U19/U15) oppure 'main'
  // (solo Senior+Over40). Di default segue l'orario (finestra Under =
  // giovedì/venerdì 17:00-19:45), ma può essere forzata a mano col pulsante
  // in alto (resta "incollata" alla scelta manuale finché non cambia giorno).
  function computeAutoViewMode(dayKey){
    if (!SHOW_UNDER) return 'main';
    if (isOnlyUnderMode()) return 'under';
    return isUnderWindow(dayKey) ? 'under' : 'main';
  }
  function getViewMode(dayKey){
    return manualViewMode || computeAutoViewMode(dayKey);
  }
  function toggleViewMode(){
    const dayKey = currentDayKey || getCurrentDayKey();
    const current = getViewMode(dayKey);
    manualViewMode = current === 'under' ? 'main' : 'under';
    applyContext();
  }
  function updateModeUI(viewMode){
    const modeBadge = document.getElementById('modeBadge');
    const btn = document.getElementById('viewToggleBtn');
    if (!modeBadge || !btn) return;
    modeBadge.classList.toggle('active', viewMode === 'under');
    modeBadge.textContent = viewMode === 'under' ? 'TORNEO UNDER LIVE' : 'SENIOR / OVER40';
    const relevantDay = SHOW_UNDER && UNDER_DAYS.includes(currentDayKey);
    if (relevantDay){
      btn.style.display = 'inline-block';
      btn.textContent = viewMode === 'under' ? 'Vedi Senior/Over40 →' : '← Torna a Under';
    } else {
      btn.style.display = 'none';
    }
  }

  function updateClock(){
    document.getElementById('clock').textContent =
      new Date().toLocaleTimeString('it-IT', { hour:'2-digit', minute:'2-digit' });
  }
  updateClock();
  setInterval(updateClock, 1000);

  // Controllo leggero (ogni secondo) del cambio di fascia oraria: scatta solo
  // quando la modalità automatica cambia stato, e solo se non c'è una scelta
  // manuale attiva (il pulsante ha sempre la precedenza finché non cambia giorno).
  function checkWindowTransition(){
    if (!currentDayKey) return;
    if (manualViewMode !== null) return;
    const mode = computeAutoViewMode(currentDayKey);
    if (mode !== lastWindowState){
      applyContext();
    }
  }
  setInterval(checkWindowTransition, 1000);

  function fitToScreen(){
    const root = document.getElementById('tvRoot');
    if (!root) return;
    const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    root.style.transform = `scale(${scale})`;
  }
  fitToScreen();
  window.addEventListener('resize', fitToScreen);

  const viewToggleBtnEl = document.getElementById('viewToggleBtn');
  if (viewToggleBtnEl) viewToggleBtnEl.addEventListener('click', toggleViewMode);

  async function fetchTorneoData(){
    const statusEl = document.getElementById('dataStatus');
    const loading = document.getElementById('loadingScreen');
    if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('INCOLLA_QUI') !== -1){
      document.getElementById('loadingMsg').textContent = 'Collegamento dati non configurato: imposta APPS_SCRIPT_URL nel file.';
      statusEl.classList.add('err');
      statusEl.querySelector('.txt').textContent = 'Non configurato';
      return;
    }
    try {
      const res = await fetch(APPS_SCRIPT_URL, { cache:'no-store' });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || 'Errore sconosciuto');
      TORNEO_DATA = json;
      const stamp = new Date(json.generatedAt).toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'});
      statusEl.classList.remove('err');
      statusEl.querySelector('.txt').textContent = 'Aggiornato ' + stamp;
      loading.style.display = 'none';

      applyContext();
    } catch (err) {
      statusEl.classList.add('err');
      statusEl.querySelector('.txt').textContent = 'Errore dati: ' + err.message;
      console.error('Errore fetch dati torneo (TV):', err);
    }
  }

  async function fetchUnderData(){
    if (!APPS_SCRIPT_URL_UNDER || APPS_SCRIPT_URL_UNDER.indexOf('INCOLLA_QUI') !== -1) return;
    try {
      const res = await fetch(APPS_SCRIPT_URL_UNDER, { cache:'no-store' });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || 'Errore sconosciuto');
      UNDER_DATA = json.under;
      applyContext();
    } catch (err) {
      console.error('Errore fetch dati Under (TV):', err);
    }
  }

  // Punto unico che ricostruisce sequenza e badge ad ogni aggiornamento dati,
  // cambio fascia oraria o click sul pulsante di modalità.
  function applyContext(){
    if (!TORNEO_DATA) return; // aspetta almeno i dati Senior prima di costruire qualsiasi sequenza
    const dayKey = getCurrentDayKey();
    const dayChanged = dayKey !== currentDayKey;
    if (dayChanged) manualViewMode = null; // la scelta manuale non sopravvive al cambio giorno
    currentDayKey = dayKey;
    document.getElementById('dayBadge').textContent = DAY_LABELS[dayKey] || dayKey;

    const viewMode = getViewMode(dayKey);
    lastWindowState = computeAutoViewMode(dayKey);
    updateModeUI(viewMode);

    const prevId = SEQUENCE[seqIndex] ? SEQUENCE[seqIndex].id : null;

    SEQUENCE = buildSequence(dayKey, viewMode);
    markEmptiness(SEQUENCE, dayKey);

    if (dayChanged || !prevId){
      seqIndex = 0;
    } else {
      const found = SEQUENCE.findIndex(p => p.id === prevId);
      seqIndex = found !== -1 ? found : 0;
    }
    renderNav();
    renderCurrentPanel();
    if (!panelTimer && !isPaused) startCycle();
  }

  function findBlocco(titoloParziale){
    if (!TORNEO_DATA) return null;
    const t = titoloParziale.toLowerCase();
    return (TORNEO_DATA.classifiche || []).find(b => b.titolo.toLowerCase().indexOf(t) !== -1) || null;
  }

  function classifyFase(fase){
    if (!fase) return 'eliminazione';
    return fase.toLowerCase().indexOf('triangolare') !== -1 ? 'triangolare' : 'eliminazione';
  }

  function matchesForDay(dayKey, cat, calFilter){
    const filtro = cat === 'senior' ? 'Main' : 'Over40';
    if (dayKey === 'venerdi'){
      let list = (TORNEO_DATA.calendarioFinale || [])
        .filter(m => (m['Torneo'] || '').indexOf(filtro) !== -1)
        .map(m => ({
          orario: m['Orario'], campo: m['Campo'], meta: m['Meta'], fase: m['Fase'],
          casa: m['Squadra Casa (risolta)'] || m['Squadra/Slot Casa'],
          trasferta: m['Squadra Trasferta (risolta)'] || m['Squadra/Slot Trasferta'],
          puntiCasa: m['Punti Casa'], puntiTrasferta: m['Punti Trasferta'],
          giocata: !!(m['Punti Casa'] !== null && m['Punti Casa'] !== '' && m['Punti Trasferta'] !== null && m['Punti Trasferta'] !== '')
        }));
      if (calFilter){
        list = list.filter(m => classifyFase(m.fase) === calFilter);
      }
      return list;
    }
    const arr = (TORNEO_DATA.calendario && TORNEO_DATA.calendario[dayKey]) || [];
    return arr.filter(m => (m['Torneo'] || '').indexOf(filtro) !== -1).map(m => ({
      orario: m['Orario'], campo: m['Campo'], meta: m['Meta'], girone: m['Girone'],
      casa: m['Squadra Casa'], trasferta: m['Squadra Trasferta'],
      puntiCasa: m['Punti Casa'], puntiTrasferta: m['Punti Trasferta'], giocata: m['giocata']
    }));
  }

  function allDaysInOrder(){ return ['lunedi','martedi','mercoledi','giovedi','venerdi']; }

  // ---- Helper condiviso: raggruppa una lista di partite per campo/metà ----
  function buildCourtGroups(all){
    const groups = {};
    all.forEach(m => {
      if (!m.campo || !m.meta) return;
      const key = m.campo + '|' + m.meta;
      (groups[key] = groups[key] || []).push(m);
    });
    return Object.keys(groups).sort().map(key => {
      const list = groups[key].slice().sort((a,b) => (a.orario||'').localeCompare(b.orario||''));
      const next = list.find(m => !m.giocata);
      const last = list.slice().reverse().find(m => m.giocata);
      return { campo: list[0].campo, meta: list[0].meta, next, last };
    });
  }

  function courtCardHTML(c){
    const m = c.next || c.last;
    const statusLabel = c.next ? 'In arrivo' : 'Ultima giocata';
    const teams = m ? `${m.casa || '—'}<span class="vs">vs</span>${m.trasferta || '—'}` : '—';
    const metaBits = [];
    if (m){
      metaBits.push(m.label);
      if (m.girone) metaBits.push('Girone ' + m.girone);
      if (m.fase) metaBits.push(m.fase);
    }
    const timeOrScore = c.next
      ? (m.orario || '')
      : (m ? `${m.puntiCasa} - ${m.puntiTrasferta}` : '');
    return `
      <div class="court-card">
        <div class="court-head">Campo ${c.campo} · metà ${c.meta}</div>
        <div class="court-status">${statusLabel}</div>
        <div class="court-teams">${teams}</div>
        <div class="court-meta">${metaBits.join(' · ')}</div>
        <div class="court-time">${timeOrScore}</div>
      </div>`;
  }

  function nextByCourtForDay(dayKey){
    if (!TORNEO_DATA) return [];
    const all = [
      ...matchesForDay(dayKey, 'senior').map(m => Object.assign({ label:'Senior' }, m)),
      ...matchesForDay(dayKey, 'over40').map(m => Object.assign({ label:'Over40' }, m))
    ];
    return buildCourtGroups(all);
  }

  function renderCampiPanel(dayKey){
    const cards = nextByCourtForDay(dayKey);
    if (!cards.length){
      return `
        <div class="panel-title"><span class="cat">Live</span><h1>Prossime partite per campo</h1><span class="sub">${DAY_LABELS[dayKey] || dayKey}</span></div>
        <div class="empty-msg">Nessuna partita in programma oggi</div>`;
    }
    return `
      <div class="panel-title"><span class="cat">Live</span><h1>Prossime partite per campo</h1><span class="sub">${DAY_LABELS[dayKey] || dayKey}</span></div>
      <div class="court-grid">${cards.map(courtCardHTML).join('')}</div>`;
  }

  // ---- Costruzione sequenza pannelli in base alla modalità di visualizzazione ----
  function buildSequence(dayKey, viewMode){
    const seq = [];

    if (viewMode === 'under'){
      seq.push({ id:'und-campi', type:'und-campi', navLabel:'Prossime per campo', group:'UNDER' });
      ['U19','U15'].forEach(catU => {
        seq.push({ id:catU.toLowerCase()+'-cal', catU, type:'und-calendario', navLabel:catU+' Calendario', group:'UNDER' });
        seq.push({ id:catU.toLowerCase()+'-cl', catU, type:'und-classifiche', navLabel:catU+' Classifica', group:'UNDER' });
        seq.push({ id:catU.toLowerCase()+'-tab', catU, type:'und-tabellone', navLabel:catU+' Tabellone', group:'UNDER' });
      });
      return seq;
    }

    // viewMode === 'main': solo Senior + Over40
    seq.push({ id:'home-campi', type:'campi', navLabel:'Prossime per campo', group:'LIVE' });

    if (dayKey === 'venerdi'){
      // Classifiche Triangolari: 5 in tutto, mostrate una sotto l'altra,
      // raggruppate in 3 schede (2 + 2 + 1)
      seq.push({ id:'sen-cl-12', cat:'senior', type:'senior-classifiche-stack', triIdx:[1,2], navLabel:'Classifiche Triang. 1-2', group:'SENIOR' });
      seq.push({ id:'sen-cl-34', cat:'senior', type:'senior-classifiche-stack', triIdx:[3,4], navLabel:'Classifiche Triang. 3-4', group:'SENIOR' });
      seq.push({ id:'sen-cl-5', cat:'senior', type:'senior-classifiche-stack', triIdx:[5], navLabel:'Classifica Triang. 5', group:'SENIOR' });
      seq.push({ id:'sen-cal-full', cat:'senior', type:'calendario-venerdi', navLabel:'Calendario', group:'SENIOR' });
      seq.push({ id:'sen-tab', cat:'senior', type:'tabellone', navLabel:'Tabellone', group:'SENIOR' });

      if (SHOW_OVER40){
        seq.push({ id:'o40-tab', cat:'over40', type:'tabellone', navLabel:'Tabellone', group:'OVER40' });
        seq.push({ id:'o40-cal-full', cat:'over40', type:'calendario-venerdi', navLabel:'Calendario', group:'OVER40' });
      }
    } else {
      seq.push({ id:'sen-combo', cat:'senior', type:'combinato', navLabel:'Calendario e Classifiche', group:'SENIOR' });
      seq.push({ id:'sen-pro', cat:'senior', type:'prossime', navLabel:'Prossime', group:'SENIOR' });

      if (SHOW_OVER40){
        seq.push({ id:'o40-combo', cat:'over40', type:'combinato', navLabel:'Calendario e Classifica', group:'OVER40' });
        seq.push({ id:'o40-pro', cat:'over40', type:'prossime', navLabel:'Prossime', group:'OVER40' });
      }
    }

    return seq;
  }

  function markEmptiness(seq, dayKey){
    seq.forEach(def => {
      if (def.type === 'campi'){
        def.empty = nextByCourtForDay(dayKey).length === 0;
      } else if (def.type === 'prossime'){
        const days = allDaysInOrder();
        const startIdx = days.indexOf(dayKey);
        let found = 0;
        for (let i = startIdx; i < days.length && found === 0; i++){
          found += matchesForDay(days[i], def.cat).filter(m => !m.giocata).length;
        }
        def.empty = found === 0;
      } else if (def.type === 'combinato'){
        const hasCal = matchesForDay(dayKey, def.cat).length > 0;
        let hasClass = false;
        if (def.cat === 'senior'){
          hasClass = ['A','B','C'].some(g => { const b = findBlocco(`GIRONE ${g} — Main`); return b && b.righe.length; });
        } else {
          const b = findBlocco('OVER40 — GIRONE UNICO');
          hasClass = !!(b && b.righe.length);
        }
        def.empty = !hasCal && !hasClass;
      } else if (def.type === 'senior-classifiche-stack'){
        def.empty = def.triIdx.every(n => { const b = findBlocco('TRIANGOLARE ' + n); return !b || !b.righe.length; });
      } else if (def.type === 'calendario-venerdi'){
        def.empty = matchesForDay('venerdi', def.cat).length === 0;
      } else if (def.type === 'tabellone'){
        def.empty = tabelloneRowsForCat(def.cat).length === 0;
      } else if (def.type === 'und-campi'){
        def.empty = nextByCourtForDayUnder(dayKey).length === 0;
      } else if (def.type === 'und-calendario'){
        const m = underMatchesForDay(def.catU, dayKey);
        const f = dayKey === 'venerdi' ? underFinaleMatches(def.catU) : [];
        def.empty = (m.length + f.length) === 0;
      } else if (def.type === 'und-classifiche'){
        def.empty = !UNDER_DATA || !UNDER_DATA[def.catU] || !(UNDER_DATA[def.catU].classifica || []).length;
      } else if (def.type === 'und-tabellone'){
        def.empty = underTabelloneRows(def.catU).length === 0;
      }
    });
  }

  function matchCardHTML(m){
    const metaBits = [];
    if (m.girone) metaBits.push('Girone ' + m.girone);
    if (m.fase) metaBits.push(m.fase);
    if (m.campo) metaBits.push('Campo ' + m.campo + (m.meta ? ' · metà ' + m.meta : ''));

    let casaWin = false, trasfWin = false;
    if (m.giocata){
      const pc = Number(m.puntiCasa), pt = Number(m.puntiTrasferta);
      if (!isNaN(pc) && !isNaN(pt)){
        if (pc > pt) casaWin = true; else if (pt > pc) trasfWin = true;
      }
    }
    const scoreHTML = m.giocata
      ? `<div class="match-score">${m.puntiCasa} - ${m.puntiTrasferta}</div>`
      : `<div class="match-score time">${m.orario || ''}</div>`;

    return `
      <div class="match-card${m.giocata ? ' done' : ''}">
        <div class="match-teams">
          <div class="mt-line">
            <span class="team${casaWin ? ' winner' : ''}">${m.casa || '—'}</span><span class="vs">vs</span><span class="team${trasfWin ? ' winner' : ''}">${m.trasferta || '—'}</span>
          </div>
          <div class="mt-meta">${metaBits.join(' · ')}</div>
        </div>
        ${scoreHTML}
      </div>`;
  }

  function renderCalendarioPanel(def, dayKey){
    const matches = matchesForDay(dayKey, def.cat, def.calFilter);
    const label = def.cat === 'senior' ? 'Senior' : 'Over40';
    const titleText = def.calFilter === 'triangolare' ? 'Triangolari — Programma'
      : def.calFilter === 'eliminazione' ? 'Fase a eliminazione — Programma'
      : (dayKey === 'venerdi' ? 'Programma di giornata' : 'Calendario di oggi');

    if (!matches.length){
      return `
        <div class="panel-title"><span class="cat">${label}</span><h1>${titleText}</h1><span class="sub">${DAY_LABELS[dayKey] || dayKey}</span></div>
        <div class="empty-msg">Nessuna partita in programma${def.calFilter ? ' per questa fase' : ' oggi'} per ${label}</div>`;
    }

    if (dayKey === 'venerdi'){
      const groups = [];
      matches.forEach(m => {
        const faseName = m.fase || 'Programma';
        let g = groups.find(x => x.fase === faseName);
        if (!g){ g = { fase: faseName, items: [] }; groups.push(g); }
        g.items.push(m);
      });
      const html = groups.map(g => `
        <div class="agenda-fase">${g.fase}</div>
        <div class="match-grid compact">${g.items.map(matchCardHTML).join('')}</div>
      `).join('');
      return `
        <div class="panel-title"><span class="cat">${label}</span><h1>${titleText}</h1><span class="sub">${DAY_LABELS[dayKey]}</span></div>
        <div class="agenda-scroll">${html}</div>`;
    }

    return `
      <div class="panel-title"><span class="cat">${label}</span><h1>${titleText}</h1><span class="sub">${DAY_LABELS[dayKey] || dayKey}</span></div>
      <div class="match-grid">${matches.map(matchCardHTML).join('')}</div>`;
  }

  // Ordina sempre le righe per posizione (numero in colonna "Pos"/"Posizione") prima
  // di disegnare la tabella: i dati arrivano dal foglio nell'ordine fisso degli slot
  // (1A, 2A, 3A...), non nell'ordine di classifica, quindi va riordinato qui.
  function classTableHTML(righe, keySquadra, highlightTop, highlightClass){
    const cls = highlightClass || 'qualified';
    const righeOrdinate = righe
      .map((r, i) => ({ r, pos: Number(r['Pos'] ?? r['Posizione'] ?? (i + 1)) }))
      .sort((a, b) => a.pos - b.pos);

    const rows = righeOrdinate.map(({ r, pos }) => {
      const qualified = highlightTop && pos <= highlightTop;
      return `
      <tr class="${qualified ? cls : ''}">
        <td class="num pos">${pos}</td>
        <td class="squadra">${r[keySquadra] || '—'}</td>
        <td class="num">${r['PG'] ?? ''}</td>
        <td class="num">${r['V'] ?? ''}</td>
        <td class="num">${r['S'] ?? ''}</td>
        <td class="num">${r['PF'] ?? ''}</td>
        <td class="num">${r['PS'] ?? ''}</td>
        <td class="num">${r['DIFF'] ?? ''}</td>
      </tr>`;
    }).join('');
    return `<table>
      <thead><tr><th>#</th><th>Squadra</th><th>PG</th><th>V</th><th>S</th><th>PF</th><th>PS</th><th>Diff</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  }

  function renderClassifichePanel(def){
    const label = def.cat === 'senior' ? 'Senior' : 'Over40';

    if (def.variant === 'recap-gironi'){
      const blocks = ['A','B','C'].map(g => {
        const b = findBlocco(`GIRONE ${g} — Main`);
        return { head: 'Girone ' + g, righe: b ? b.righe : [] };
      }).filter(b => b.righe.length);
      const body = blocks.length
        ? `<div class="class-wrap">
            <div class="class-grid-3">${blocks.map(b => `
              <div class="class-block">
                <div class="cb-head">${b.head}</div>
                ${classTableHTML(b.righe, 'Squadra', QUALIFY_TOP_N)}
              </div>`).join('')}</div>
            <div class="class-legend"><span class="sw"></span> Evidenziate: qualificate ai Triangolari (vedi pannelli successivi)</div>
          </div>`
        : `<div class="empty-msg">Classifiche non ancora disponibili</div>`;
      return `
        <div class="panel-title"><span class="cat">${label}</span><h1>Riepilogo Gironi</h1><span class="sub">Fine fase a gruppi</span></div>
        ${body}`;
    }

    let title = '', righe = [], highlightTop = 0, highlightClass = 'qualified', legendText = '', legendSwClass = 'sw';

    if (def.variant === 'girone'){
      const titolo = `GIRONE ${def.girone} — Main`;
      const b = findBlocco(titolo);
      righe = b ? b.righe : [];
      title = 'Girone ' + def.girone;
      highlightTop = QUALIFY_TOP_N;
      legendText = `Le prime ${QUALIFY_TOP_N} si qualificano ai Triangolari del venerdì`;
    } else if (def.variant === 'girone-unico'){
      const b = findBlocco('OVER40 — GIRONE UNICO');
      righe = b ? b.righe : [];
      title = 'Girone (tutte contro tutte)';
      highlightTop = OVER40_SEMIFINAL_TOP_N;
      legendText = `Le prime ${OVER40_SEMIFINAL_TOP_N} si qualificano alle Semifinali di venerdì`;
    } else if (def.variant === 'triangolare'){
      const b = findBlocco('TRIANGOLARE ' + def.n);
      righe = b ? b.righe : [];
      title = 'Triangolare ' + def.n;
    } else if (def.variant === 'generale'){
      const b = findBlocco('OVER40 — CLASSIFICA FINALE');
      righe = b ? b.righe : [];
      title = 'Classifica finale 1°-7°';
    } else if (def.variant === 'mini-girone'){
      const b = findBlocco('OVER40 — MINI-GIRONE');
      righe = b ? b.righe : [];
      title = 'Mini-girone 5°-6°-7°';
    }

    const compactCls = righe.length > 6 ? ' compact' : '';
    const body = righe.length
      ? `<div class="class-wrap">
          <div class="class-block${compactCls}">${classTableHTML(righe, 'Squadra', highlightTop, highlightClass)}</div>
          ${highlightTop ? `<div class="class-legend"><span class="${legendSwClass}"></span> ${legendText}</div>` : ''}
        </div>`
      : `<div class="empty-msg">Classifica non ancora disponibile</div>`;

    return `
      <div class="panel-title"><span class="cat">${label}</span><h1>${title}</h1></div>
      ${body}`;
  }

  function renderProssimePanel(def, dayKey){
    const label = def.cat === 'senior' ? 'Senior' : 'Over40';
    const days = allDaysInOrder();
    const startIdx = days.indexOf(dayKey);
    let found = [];
    for (let i = startIdx; i < days.length && found.length < 8; i++){
      const dm = matchesForDay(days[i], def.cat).filter(m => !m.giocata);
      found = found.concat(dm);
    }
    found = found.slice(0, 8);
    const body = found.length
      ? `<div class="match-grid">${found.map(matchCardHTML).join('')}</div>`
      : `<div class="empty-msg">Tutte le partite ${label} risultano giocate</div>`;
    return `
      <div class="panel-title"><span class="cat">${label}</span><h1>Prossime partite</h1></div>
      ${body}`;
  }

  // ---- Schermata combinata (Lun-Gio): calendario del giorno + tutte le
  // classifiche della categoria in un'unica schermata (invece di pannelli
  // separati per girone). Per Senior: gironi A/B/C affiancati. Per Over40:
  // girone unico.
  function renderCombinatoPanel(def, dayKey){
    const label = def.cat === 'senior' ? 'Senior' : 'Over40';
    const matches = matchesForDay(dayKey, def.cat);
    const calendarioHTML = matches.length
      ? `<div class="match-grid compact">${matches.map(matchCardHTML).join('')}</div>`
      : `<div class="empty-msg" style="font-size:20px;">Nessuna partita in programma oggi per ${label}</div>`;

    let classificaHTML;
    if (def.cat === 'senior'){
      const blocks = ['A','B','C'].map(g => {
        const b = findBlocco(`GIRONE ${g} — Main`);
        return { head: 'Girone ' + g, righe: b ? b.righe : [] };
      }).filter(b => b.righe.length);
      classificaHTML = blocks.length
        ? `<div class="class-grid-3">${blocks.map(b => `
            <div class="class-block compact">
              <div class="cb-head">${b.head}</div>
              ${classTableHTML(b.righe, 'Squadra', QUALIFY_TOP_N)}
            </div>`).join('')}</div>`
        : `<div class="empty-msg">Classifiche non ancora disponibili</div>`;
    } else {
      const b = findBlocco('OVER40 — GIRONE UNICO');
      const righe = b ? b.righe : [];
      classificaHTML = righe.length
        ? `<div class="class-block${righe.length > 6 ? ' compact' : ''}">${classTableHTML(righe, 'Squadra', OVER40_SEMIFINAL_TOP_N)}</div>`
        : `<div class="empty-msg">Classifica non ancora disponibile</div>`;
    }

    return `
      <div class="panel-title"><span class="cat">${label}</span><h1>Calendario e Classifiche</h1><span class="sub">${DAY_LABELS[dayKey] || dayKey}</span></div>
      <div style="flex:1; display:flex; flex-direction:column; gap:18px; min-height:0; overflow:hidden;">
        <div style="flex:0 0 36%; min-height:0; overflow-y:auto;">${calendarioHTML}</div>
        <div style="flex:1; min-height:0; overflow:hidden; display:flex; flex-direction:column;">${classificaHTML}</div>
      </div>`;
  }

  // ---- Classifiche Triangolari (venerdì) mostrate una sotto l'altra,
  // raggruppate in schede da 2 + 2 + 1 (invece della griglia affiancata) ----
  function renderSeniorClassificheStack(def){
    const blocksHTML = def.triIdx.map(n => {
      const b = findBlocco('TRIANGOLARE ' + n);
      const righe = b ? b.righe : [];
      const body = righe.length
        ? classTableHTML(righe, 'Squadra', 1)
        : `<div class="empty-msg" style="padding:24px; font-size:20px;">Non ancora disponibile</div>`;
      return `
        <div class="class-block stacked">
          <div class="cb-head">Triangolare ${n}</div>
          ${body}
        </div>`;
    }).join('');
    const title = def.triIdx.length > 1 ? `Classifiche Triangolari ${def.triIdx.join(' e ')}` : `Classifica Triangolare ${def.triIdx[0]}`;
    return `
      <div class="panel-title"><span class="cat">Senior</span><h1>${title}</h1></div>
      <div class="stack-wrap">${blocksHTML}</div>`;
  }

  // ---- Calendario di venerdì per Senior/Over40: solo la giornata di
  // venerdì (non interessa lo storico, c'è il sito per quello), in un'unica
  // sequenza cronologica senza divisioni per fase — la fase resta comunque
  // visibile nella riga di dettaglio di ogni partita (via matchCardHTML). ----
  function renderCalendarioVenerdiPanel(def){
    const label = def.cat === 'senior' ? 'Senior' : 'Over40';
    const matches = matchesForDay('venerdi', def.cat)
      .slice()
      .sort((a, b) => (a.orario || '').localeCompare(b.orario || ''));

    if (!matches.length){
      return `
        <div class="panel-title"><span class="cat">${label}</span><h1>Calendario</h1><span class="sub">${DAY_LABELS['venerdi']}</span></div>
        <div class="empty-msg">Nessuna partita in programma per ${label}</div>`;
    }

    return `
      <div class="panel-title"><span class="cat">${label}</span><h1>Calendario</h1><span class="sub">${DAY_LABELS['venerdi']}</span></div>
      <div class="match-grid">${matches.map(matchCardHTML).join('')}</div>`;
  }

  // ---- Tabellone (bracket) — legge TORNEO_DATA.tabellone, un array con le
  // stesse intestazioni del foglio Google "Tabellone": Torneo, Fase, Partita,
  // "Squadra 1", "Punti 1", "Punti 2", "Squadra 2", Vincitore. Se l'Apps
  // Script usa chiavi diverse, basta adattare i nomi qui sotto. ----
  function tabelloneRowsForCat(cat){
    if (!TORNEO_DATA) return [];
    const torneoName = cat === 'senior' ? 'Main' : 'Over40';
    return (TORNEO_DATA.tabellone || []).filter(r => (r['Torneo'] || '').indexOf(torneoName) !== -1);
  }

  // ---- Rendering condiviso "a tabellone tennistico": colonne per turno
  // (Quarti/Semifinali/Finale ecc.), partite impilate e distanziate in
  // verticale (si allargano ai turni successivi, come in un bracket vero),
  // con una linea di collegamento verso il turno successivo. ----
  function bracketMatchHTML(m){
    const s1 = m.s1 || 'TBD';
    const s2 = m.s2 || 'TBD';
    const p1 = m.p1, p2 = m.p2;
    const played = p1 !== null && p1 !== '' && p1 !== undefined && p2 !== null && p2 !== '' && p2 !== undefined;
    let win1 = false, win2 = false;
    if (played){
      const n1 = Number(p1), n2 = Number(p2);
      if (!isNaN(n1) && !isNaN(n2)){
        if (n1 > n2) win1 = true; else if (n2 > n1) win2 = true;
      }
    }
    return `
      <div class="bracket-match">
        <div class="bracket-team${win1 ? ' winner' : ''}"><span>${s1}</span>${played ? `<span class="pts">${p1}</span>` : ''}</div>
        <div class="bracket-vs-sep"></div>
        <div class="bracket-team${win2 ? ' winner' : ''}"><span>${s2}</span>${played ? `<span class="pts">${p2}</span>` : ''}</div>
        ${m.meta ? `<div class="bracket-match-meta">${m.meta}</div>` : ''}
      </div>`;
  }

  function renderBracketPanel(label, rounds){
    const hasAny = rounds.some(r => r.matches.length);
    if (!hasAny){
      return `
        <div class="panel-title"><span class="cat">${label}</span><h1>Tabellone</h1></div>
        <div class="empty-msg">Tabellone non ancora disponibile</div>`;
    }
    const html = rounds.filter(r => r.matches.length).map(r => `
      <div class="bracket-round">
        <div class="bracket-round-title">${r.title}</div>
        <div class="bracket-round-matches">${r.matches.map(bracketMatchHTML).join('')}</div>
      </div>
    `).join('');
    return `
      <div class="panel-title"><span class="cat">${label}</span><h1>Tabellone</h1></div>
      <div class="bracket-scroll"><div class="bracket">${html}</div></div>`;
  }

  // ---- Tabellone Main (Senior/Over40) — legge TORNEO_DATA.tabellone, un
  // array con le stesse intestazioni del foglio Google "Tabellone": Torneo,
  // Fase, Partita, "Squadra 1", "Punti 1", "Punti 2", "Squadra 2", Vincitore.
  // Se l'Apps Script usa chiavi diverse, basta adattare i nomi qui sotto. ----
  function tabelloneRowsForCat(cat){
    if (!TORNEO_DATA) return [];
    const torneoName = cat === 'senior' ? 'Main' : 'Over40';
    return (TORNEO_DATA.tabellone || []).filter(r => (r['Torneo'] || '').indexOf(torneoName) !== -1);
  }

  function tabelloneRoundsForCat(cat){
    const rows = tabelloneRowsForCat(cat);
    const rounds = [];
    rows.forEach(r => {
      const fase = r['Fase'] || 'Fase';
      let g = rounds.find(x => x.title === fase);
      if (!g){ g = { title: fase, matches: [] }; rounds.push(g); }
      g.matches.push({ s1: r['Squadra 1'], s2: r['Squadra 2'], p1: r['Punti 1'], p2: r['Punti 2'], meta: r['Partita'] });
    });
    return rounds;
  }

  function renderTabellonePanel(cat){
    const label = cat === 'senior' ? 'Senior' : 'Over40';
    return renderBracketPanel(label, tabelloneRoundsForCat(cat));
  }

  // ===================== TORNEO UNDER (U19/U15) =====================
  // Attivo solo giovedì/venerdì 17:00→19:45 (vedi isUnderWindow), oppure
  // sempre attivo in modalità "solo Under" (isOnlyUnderMode / pulsante).
  // Riusa lo stesso formato dati del sito (index.html): UNDER_DATA[cat] con
  // .classifica, .calendario[giorno], .finale (quarti/semifinali/finali).
  // Non esiste un foglio "Tabellone" separato per l'Under: il pannello
  // Tabellone Under riusa direttamente .finale (che ha già gli slot risolti
  // in nomi reali quando possibile), mostrando "TBD" per quelli non ancora
  // risolti — vedi underTabelloneRows() più sotto.

  function underMatchesForDay(cat, dayKey){
    if (!UNDER_DATA || !UNDER_DATA[cat]) return [];
    const arr = (UNDER_DATA[cat].calendario || {})[dayKey] || [];
    return arr.map(m => ({
      orario: m['Orario'], campo: m['Campo'], meta: m['Meta'], girone: m['Girone'],
      casa: m['Squadra Casa'], trasferta: m['Squadra Trasferta'],
      puntiCasa: m['Punti Casa'], puntiTrasferta: m['Punti Trasferta'], giocata: m.giocata
    }));
  }

  // Le partite di fase finale (quarti/semifinali/finali) partono con slot
  // placeholder (es. "1G1U15", "VincQF1_U15") finché non vengono sostituiti a
  // mano con le squadre reali classificate: fino ad allora le nascondiamo,
  // altrimenti in TV apparirebbero codici incomprensibili invece di nomi squadra.
  function underFinaleMatches(cat){
    if (!UNDER_DATA || !UNDER_DATA[cat]) return [];
    return (UNDER_DATA[cat].finale || [])
      .map(m => ({
        fase: m['Fase'], campo: m['Campo'], meta: m['Meta'], orario: m['Orario'],
        casa: m['Squadra Casa'], trasferta: m['Squadra Trasferta'],
        puntiCasa: m['Punti Casa'], puntiTrasferta: m['Punti Trasferta'], giocata: m.giocata
      }))
      .filter(m => m.casa && m.trasferta && !String(m.casa).match(/^(\d)G1U|^(Vinc|Perd)(SF|QF)/) && !String(m.trasferta).match(/^(\d)G1U|^(Vinc|Perd)(SF|QF)/));
  }

  function nextByCourtForDayUnder(dayKey){
    if (!UNDER_DATA) return [];
    let all = [
      ...underMatchesForDay('U15', dayKey).map(m => Object.assign({ label:'U15' }, m)),
      ...underMatchesForDay('U19', dayKey).map(m => Object.assign({ label:'U19' }, m))
    ];
    if (dayKey === 'venerdi'){
      all = all.concat(
        underFinaleMatches('U15').map(m => Object.assign({ label:'U15' }, m)),
        underFinaleMatches('U19').map(m => Object.assign({ label:'U19' }, m))
      );
    }
    return buildCourtGroups(all);
  }

  function renderCampiPanelUnder(dayKey){
    const cards = nextByCourtForDayUnder(dayKey);
    if (!cards.length){
      return `
        <div class="panel-title"><span class="cat">Under</span><h1>Prossime partite per campo</h1><span class="sub">${DAY_LABELS[dayKey] || dayKey}</span></div>
        <div class="empty-msg">Nessuna partita in programma</div>`;
    }
    return `
      <div class="panel-title"><span class="cat">Under</span><h1>Prossime partite per campo</h1><span class="sub">${DAY_LABELS[dayKey] || dayKey}</span></div>
      <div class="court-grid">${cards.map(courtCardHTML).join('')}</div>`;
  }

  function renderUnderCalendarioPanel(cat, dayKey){
    const label = cat === 'U15' ? 'U15/U14' : 'U19/U17';
    const matches = underMatchesForDay(cat, dayKey);
    const finaleMatches = dayKey === 'venerdi' ? underFinaleMatches(cat) : [];
    const titleText = dayKey === 'venerdi' ? 'Programma di giornata' : 'Calendario di oggi';
    const all = matches.concat(finaleMatches).sort((a, b) => (a.orario || '').localeCompare(b.orario || ''));

    if (!all.length){
      return `
        <div class="panel-title"><span class="cat">${label}</span><h1>${titleText}</h1><span class="sub">${DAY_LABELS[dayKey] || dayKey}</span></div>
        <div class="empty-msg">Nessuna partita in programma oggi per ${label}</div>`;
    }

    return `
      <div class="panel-title"><span class="cat">${label}</span><h1>${titleText}</h1><span class="sub">${DAY_LABELS[dayKey] || dayKey}</span></div>
      <div class="match-grid">${all.map(matchCardHTML).join('')}</div>`;
  }

  function renderUnderClassifichePanel(cat){
    const label = cat === 'U15' ? 'U15/U14' : 'U19/U17';
    const righe = (UNDER_DATA && UNDER_DATA[cat] && UNDER_DATA[cat].classifica) || [];
    const highlightTop = cat === 'U19' ? U19_QUALIFY_TOP_N : 0;
    const legendText = cat === 'U19'
      ? `Le prime ${U19_QUALIFY_TOP_N} accedono alle semifinali incrociate del venerdì`
      : 'Tutte le squadre passano ai Quarti di finale del venerdì';

    if (!righe.length){
      return `
        <div class="panel-title"><span class="cat">${label}</span><h1>Classifica — Girone Unico</h1></div>
        <div class="empty-msg">Classifica non ancora disponibile</div>`;
    }
    const compactCls = righe.length > 6 ? ' compact' : '';
    return `
      <div class="panel-title"><span class="cat">${label}</span><h1>Classifica — Girone Unico</h1></div>
      <div class="class-wrap">
        <div class="class-block${compactCls}">${classTableHTML(righe, 'Squadra', highlightTop)}</div>
        <div class="class-legend"><span class="sw"></span> ${legendText}</div>
      </div>`;
  }

  // ---- Tabellone Under (U19/U15): non esiste un foglio "Tabellone"
  // separato, quindi si ricava da UNDER_DATA[cat].finale (già nel formato
  // {fase, casa, trasferta, puntiCasa, puntiTrasferta, giocata} compatibile
  // con matchCardHTML). Gli slot non ancora risolti (es. "1G1U15",
  // "VincSF1_U15") vengono mostrati come "TBD" invece del codice grezzo. ----
  function underTabelloneRows(cat){
    if (!UNDER_DATA || !UNDER_DATA[cat]) return [];
    const isPlaceholder = v => v && /^(\d)G1U|^(Vinc|Perd)SF/.test(String(v));
    return (UNDER_DATA[cat].finale || []).map(r => ({
      fase: r['Fase'], campo: r['Campo'], meta: r['Meta'], orario: r['Orario'],
      casa: isPlaceholder(r['Squadra Casa']) ? 'TBD' : r['Squadra Casa'],
      trasferta: isPlaceholder(r['Squadra Trasferta']) ? 'TBD' : r['Squadra Trasferta'],
      puntiCasa: r['Punti Casa'], puntiTrasferta: r['Punti Trasferta'], giocata: r.giocata
    }));
  }

  function underTabelloneRounds(cat){
    const rows = underTabelloneRows(cat);
    const rounds = [];
    rows.forEach(r => {
      const fase = r.fase || 'Fase';
      let g = rounds.find(x => x.title === fase);
      if (!g){ g = { title: fase, matches: [] }; rounds.push(g); }
      g.matches.push({ s1: r.casa, s2: r.trasferta, p1: r.puntiCasa, p2: r.puntiTrasferta, meta: r.orario ? ('Ore ' + r.orario) : '' });
    });
    return rounds;
  }

  function renderUnderTabellonePanel(cat){
    const label = cat === 'U15' ? 'U15/U14' : 'U19/U17';
    return renderBracketPanel(label, underTabelloneRounds(cat));
  }

  // ===================== fine sezione Under =====================

  function renderPanelHTML(def, dayKey){
    if (def.type === 'campi') return renderCampiPanel(dayKey);
    if (def.type === 'calendario') return renderCalendarioPanel(def, dayKey);
    if (def.type === 'classifiche') return renderClassifichePanel(def);
    if (def.type === 'prossime') return renderProssimePanel(def, dayKey);
    if (def.type === 'combinato') return renderCombinatoPanel(def, dayKey);
    if (def.type === 'senior-classifiche-stack') return renderSeniorClassificheStack(def);
    if (def.type === 'calendario-venerdi') return renderCalendarioVenerdiPanel(def);
    if (def.type === 'tabellone') return renderTabellonePanel(def.cat);
    if (def.type === 'und-campi') return renderCampiPanelUnder(dayKey);
    if (def.type === 'und-calendario') return renderUnderCalendarioPanel(def.catU, dayKey);
    if (def.type === 'und-classifiche') return renderUnderClassifichePanel(def.catU);
    if (def.type === 'und-tabellone') return renderUnderTabellonePanel(def.catU);
    return '';
  }

  function renderCurrentPanel(){
    if (!SEQUENCE.length) return;
    const def = SEQUENCE[seqIndex];
    const stage = document.getElementById('stage');
    const html = renderPanelHTML(def, currentDayKey);
    const newPanel = document.createElement('div');
    newPanel.className = 'panel';
    newPanel.innerHTML = html;
    stage.querySelectorAll('.panel').forEach(p => p.remove());
    stage.appendChild(newPanel);
    requestAnimationFrame(() => newPanel.classList.add('active'));
    highlightActiveNav();
  }

  function renderNav(){
    const nav = document.getElementById('tvNav');
    let html = `<div class="nav-btn-play" id="playPauseBtn">${isPaused ? '▶' : '⏸'}</div><div class="nav-sep"></div>`;
    let lastGroup = null;
    SEQUENCE.forEach((def, i) => {
      if (def.group !== lastGroup){
        if (lastGroup !== null) html += `<div class="nav-sep"></div>`;
        html += `<div class="nav-group-label">${def.group}</div>`;
        lastGroup = def.group;
      }
      html += `<div class="nav-pill${def.empty ? ' empty' : ''}" data-idx="${i}" title="${def.empty ? 'Nessun dato al momento' : ''}">${def.navLabel}</div>`;
    });
    nav.innerHTML = html;

    document.getElementById('playPauseBtn').addEventListener('click', togglePause);
    nav.querySelectorAll('.nav-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        seqIndex = Number(pill.dataset.idx);
        isPaused = true;
        stopCycle();
        renderCurrentPanel();
        updatePlayPauseIcon();
      });
    });
  }

  function highlightActiveNav(){
    document.querySelectorAll('.nav-pill').forEach((p,i) => p.classList.toggle('active', i === seqIndex));
  }

  function updatePlayPauseIcon(){
    const btn = document.getElementById('playPauseBtn');
    if (btn) btn.textContent = isPaused ? '▶' : '⏸';
  }

  function togglePause(){
    isPaused = !isPaused;
    updatePlayPauseIcon();
    if (isPaused){ stopCycle(); } else { startCycle(); }
  }

  function startCycle(){
    stopCycle();
    panelTimer = setInterval(() => {
      let attempts = 0;
      do {
        seqIndex = (seqIndex + 1) % SEQUENCE.length;
        attempts++;
      } while (SEQUENCE[seqIndex] && SEQUENCE[seqIndex].empty && attempts < SEQUENCE.length);
      renderCurrentPanel();
    }, PANEL_DURATION_MS);
  }
  function stopCycle(){
    if (panelTimer){ clearInterval(panelTimer); panelTimer = null; }
  }

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space'){ e.preventDefault(); togglePause(); }
    else if (e.code === 'ArrowRight'){ seqIndex = (seqIndex + 1) % SEQUENCE.length; isPaused = true; stopCycle(); updatePlayPauseIcon(); renderCurrentPanel(); }
    else if (e.code === 'ArrowLeft'){ seqIndex = (seqIndex - 1 + SEQUENCE.length) % SEQUENCE.length; isPaused = true; stopCycle(); updatePlayPauseIcon(); renderCurrentPanel(); }
  });

  renderSponsorMarquee();
  fetchTorneoData();
  setInterval(fetchTorneoData, DATA_REFRESH_MS);
  fetchUnderData();
  setInterval(fetchUnderData, UNDER_REFRESH_MS);
</script>

</body>
</html>
